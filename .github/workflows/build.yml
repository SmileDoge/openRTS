# Windows build: Release, the tests, and an archive with the viewer and the
# tools (openRTS-windows-x64). The tests need no RTS content, GPU or sound
# card: they build their own small tracks and render sound offline.
# Releases: a tag vX.Y.Z makes the release "openRTS vX.Y.Z"; every push to
# master replaces the "nightly" pre-release.
name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    env:
      # openRTS's wgpu-native (github.com/SmileDoge/wgpu-native, branch
      # openrts: the official one with the D3D11 shared-texture import, for
      # VR and DLSS; built and released by its own GitHub Actions).
      WGPU_VERSION: v27.0.4.0-openrts.6
      WGPU_REPO: SmileDoge/wgpu-native
      # NVIDIA Streamline (DLSS): its official SDK release; the game loads
      # its DLLs at run time (LICENSE-EXCEPTIONS.md).
      STREAMLINE_VERSION: v2.14.16
      DXC_VERSION: v1.9.2609
      DXC_ZIP: dxc_2026_09_29.zip
      # The compiler's cache in GitHub's cache (sccache): a build compiles
      # only what changed since a cached one.
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Cache wgpu-native
        id: wgpu-cache
        uses: actions/cache@v4
        with:
          path: wgpu-native
          key: wgpu-native-${{ env.WGPU_REPO }}-${{ env.WGPU_VERSION }}-windows-x86_64-msvc-release

      - name: Download wgpu-native
        if: steps.wgpu-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/$env:WGPU_REPO/releases/download/$env:WGPU_VERSION/wgpu-windows-x86_64-msvc-release.zip"
          Invoke-WebRequest $url -OutFile wgpu.zip
          Expand-Archive wgpu.zip -DestinationPath wgpu-native

      # NVIDIA Streamline: its headers, the four DLLs DLSS needs and their
      # terms, kept (the SDK's archive is some 276 MB).
      - name: Cache Streamline
        id: streamline-cache
        uses: actions/cache@v4
        with:
          path: streamline
          key: streamline-${{ env.STREAMLINE_VERSION }}

      - name: Download Streamline
        if: steps.streamline-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $version = $env:STREAMLINE_VERSION
          $url = "https://github.com/NVIDIA-RTX/Streamline/releases/download/$version/streamline-sdk-$version.zip"
          Invoke-WebRequest $url -OutFile streamline.zip
          Expand-Archive streamline.zip -DestinationPath streamline-sdk
          New-Item -ItemType Directory -Force streamline/bin/x64 | Out-Null
          Copy-Item streamline-sdk/include streamline/include -Recurse
          Copy-Item streamline-sdk/bin/x64/sl.interposer.dll, streamline-sdk/bin/x64/sl.common.dll, streamline-sdk/bin/x64/sl.dlss.dll, streamline-sdk/bin/x64/nvngx_dlss.dll, streamline-sdk/bin/x64/nvngx_dlss.license.txt streamline/bin/x64
          Copy-Item streamline-sdk/license.txt, streamline-sdk/3rd-party-licenses.md streamline
          Remove-Item streamline.zip, streamline-sdk -Recurse -Force

      # Microsoft's DirectX Shader Compiler (its distributable dxcompiler.dll
      # and dxil.dll): Direct3D 12's shaders in seconds instead of FXC's
      # minutes on slower machines (docs/shaders.md).
      - name: Cache DXC
        id: dxc-cache
        uses: actions/cache@v4
        with:
          path: dxc
          key: dxc-${{ env.DXC_VERSION }}-${{ env.DXC_ZIP }}

      - name: Download DXC
        if: steps.dxc-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/microsoft/DirectXShaderCompiler/releases/download/$env:DXC_VERSION/$env:DXC_ZIP"
          Invoke-WebRequest $url -OutFile dxc.zip
          Expand-Archive dxc.zip -DestinationPath dxc

      # Ninja (Multi-Config: the programs stay in their Release folders) in
      # the MSVC environment: the Visual Studio generator cannot call a
      # compiler launcher. openrts-dllhost32 is still built by Visual
      # Studio's (CMakeLists.txt).
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # The build's label after the version in the windows' titles: "nightly
      # <commit>" for a push to master (the nightly release), "ci <commit>"
      # for a pull request or a manual run, none for a version tag.
      - name: Configure
        shell: pwsh
        run: |
          $commit = $env:GITHUB_SHA.Substring(0, 7)
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $label = '' }
          elseif ($env:GITHUB_REF -eq 'refs/heads/master' -and $env:GITHUB_EVENT_NAME -eq 'push') { $label = "nightly $commit" }
          else { $label = "ci $commit" }
          cmake -S . -B build -G "Ninja Multi-Config" -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DOPENRTS_ENABLE_WGPU=ON "-DOPENRTS_WGPU_ROOT=$env:GITHUB_WORKSPACE/wgpu-native" "-DOPENRTS_DXC_ROOT=$env:GITHUB_WORKSPACE/dxc" "-DOPENRTS_STREAMLINE_ROOT=$env:GITHUB_WORKSPACE/streamline" "-DOPENRTS_BUILD_LABEL=$label"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Compiler cache
        if: always()
        run: sccache --show-stats

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $out = "openRTS-windows-x64"
          New-Item -ItemType Directory -Force "$out/tools" | Out-Null
          Copy-Item build/game/Release/openrts_game.exe, build/game/Release/openrts-updater.exe, build/viewer/Release/openrts_viewer.exe, build/viewer/Release/wgpu_native.dll, build/viewer/Release/dxcompiler.dll, build/viewer/Release/dxil.dll, build/viewer/Release/openrts-dllhost32.exe, build/server/Release/openrts-server.exe $out
          # VR (the OpenXR loader) and DLSS (Streamline's DLLs), beside the game.
          Copy-Item build/viewer/Release/openxr_loader.dll, build/viewer/Release/sl.interposer.dll, build/viewer/Release/sl.common.dll, build/viewer/Release/sl.dlss.dll, build/viewer/Release/nvngx_dlss.dll $out
          Get-ChildItem build/tools -Recurse -Filter *.exe | Where-Object { $_.DirectoryName -like '*\Release' } |
              ForEach-Object { Copy-Item $_.FullName "$out/tools" }
          # Luau samples (the ВР 292) and how to script, for the brake stand.
          New-Item -ItemType Directory -Force "$out/sdk/luau" | Out-Null
          Copy-Item sdk/luau/*.luau, docs/ru/scripting.md "$out/sdk/luau"
          Copy-Item docs/scripting.md "$out/sdk/luau/scripting_en.md"
          # openRTS materials: templates, a demo mod and the guide (PBR stage 4).
          New-Item -ItemType Directory -Force "$out/sdk/materials" | Out-Null
          Copy-Item sdk/materials/* "$out/sdk/materials" -Recurse
          Copy-Item docs/ru/pbr-materials.md "$out/sdk/materials"
          Copy-Item docs/pbr-materials.md "$out/sdk/materials/pbr-materials_en.md"
          Copy-Item README.md, README_EN.md, INSTALL.md, INSTALL_EN.md, LICENSE, LICENSE-EXCEPTIONS.md $out
          # DXC's terms beside its two DLLs.
          New-Item -ItemType Directory -Force "$out/licenses/dxc" | Out-Null
          Copy-Item dxc/LICENSE-MS.txt, dxc/LICENSE-LLVM.txt, dxc/LICENCE-MIT.txt "$out/licenses/dxc"
          # Streamline's and DLSS's terms beside theirs.
          New-Item -ItemType Directory -Force "$out/licenses/streamline" | Out-Null
          Copy-Item streamline/license.txt, streamline/3rd-party-licenses.md, streamline/bin/x64/nvngx_dlss.license.txt "$out/licenses/streamline"
          # The OpenXR loader's (Apache 2.0).
          New-Item -ItemType Directory -Force "$out/licenses/openxr" | Out-Null
          Copy-Item build/_deps/openxr_loader-src/share/doc/openxr/LICENSE "$out/licenses/openxr"
          # openRTS's own packs (the thunder) and their authors.
          Copy-Item build/game/Release/PACKS "$out/PACKS" -Recurse
          Copy-Item packs/thunder/CREDITS.txt "$out/PACKS/openrts-thunder-CREDITS.txt"
          Copy-Item packs/snow/CREDITS.txt "$out/PACKS/openrts-snow-CREDITS.txt"
          Copy-Item packs/rails/CREDITS.txt "$out/PACKS/openrts-rails-CREDITS.txt"
          # What people miss first: the VC++ runtime and the RTS installation.
          @(
            'openRTS - перед запуском / before you start',
            '',
            '1. Нужен Microsoft Visual C++ Redistributable (x64). Без него Windows пишет,',
            '   что не найден VCRUNTIME140.dll / VCRUNTIME140_1.dll / MSVCP140.dll.',
            '   The Microsoft Visual C++ Redistributable (x64) is required. Without it',
            '   Windows reports VCRUNTIME140.dll / VCRUNTIME140_1.dll / MSVCP140.dll missing.',
            '   https://aka.ms/vs/17/release/vc_redist.x64.exe',
            '',
            '2. Нужна своя установка RTS с маршрутами и подвижным составом.',
            '   You need your own RTS installation with routes and rolling stock.',
            '',
            '3. Запустите openrts_game.exe (стартовое меню) и укажите папку RTS.',
            '   Run openrts_game.exe (the start menu) and give it the RTS folder.',
            '',
            '4. Обновить openRTS без игры (например, на сервере): openrts-updater.exe.',
            '   To update openRTS without the game (a server, say): openrts-updater.exe.',
            '',
            'Подробности / details: INSTALL.md (русский), INSTALL_EN.md (English).'
          ) | Out-File -Encoding utf8BOM "$out/README_FIRST.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: openRTS-windows-x64
          path: openRTS-windows-x64
          retention-days: 14

  release:
    # The archive of the Windows job as a GitHub release, with the text from
    # .github/scripts/release-notes.sh (what is needed to run, then the
    # commits since the previous version tag). Linux: cheaper minutes.
    needs: windows
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: openRTS-windows-x64
          path: openRTS-windows-x64

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            title="openRTS $tag"
          else
            tag=nightly
            title="openRTS nightly ($(date -u +%Y-%m-%d), ${GITHUB_SHA::7})"
          fi
          # One folder inside the zip, so unpacking does not spill files.
          folder="openRTS-$tag"
          mv openRTS-windows-x64 "$folder"
          archive="openRTS-windows-x64-$tag.zip"
          zip -qr "$archive" "$folder"
          bash .github/scripts/release-notes.sh "$tag" > notes.md
          if [ "$tag" = nightly ]; then
            gh release delete nightly --cleanup-tag --yes || true
            gh release create nightly "$archive" --title "$title" --notes-file notes.md --prerelease --target "$GITHUB_SHA"
          else
            gh release create "$tag" "$archive" --title "$title" --notes-file notes.md --verify-tag
          fi

      - name: Announce on Discord
        # A version release only, once it is published (the step above
        # succeeded); skipped while the repository has no
        # DISCORD_WEBHOOK_URL secret. A failed announcement does not fail
        # the release.
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "No DISCORD_WEBHOOK_URL secret: the release is not announced."
            exit 0
          fi
          bash .github/scripts/discord-announce.sh "${GITHUB_REF#refs/tags/}"
